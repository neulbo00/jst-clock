<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JST Field Clock (현장용 타이머)</title>
    <style>
        /* Base Styling & Pure System Fonts (Zero Network Dependencies) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            overflow: hidden;
        }

        /* Monospace Tabular Font for Ultra-Stable Digits */
        .num-font {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Header */
        header {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
        }

        .tag-jst {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        .dot-green {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .date-display {
            font-size: 15px;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 0.05em;
        }

        /* Main Clock Area */
        main {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px 0;
        }

        .clock-card {
            background-color: #030712;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease;
        }

        /* High Contrast Color Modes */
        .color-red {
            color: #ff1111 !important;
        }

        .color-white {
            color: #ffffff !important;
        }

        .time-main {
            font-size: clamp(3.2rem, 14vw, 11rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .time-sub {
            display: inline-flex;
            align-items: baseline;
            margin-left: 4px;
        }

        .time-dot {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 300;
        }

        .time-ms {
            font-size: clamp(2.8rem, 9vw, 7rem);
            font-weight: 800;
            width: 1ch;
            text-align: left;
        }

        /* Control Toolbar */
        footer {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        @media (min-width: 640px) {
            .toolbar {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        .btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.15s, transform 0.05s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            background-color: #334155;
            transform: scale(0.97);
        }

        .btn-active {
            background-color: #7f1d1d;
            border-color: #ef4444;
            color: #fca5a5;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            padding: 0 4px;
        }

        /* Error Fallback Box */
        #error-banner {
            display: none;
            background-color: #991b1b;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header: JST Date -->
    <header>
        <div class="tag-jst">
            <span class="dot-green"></span>
            <span>JST (UTC+9)</span>
        </div>
        <div id="jst-date" class="date-display num-font">----.--.-- (--)</div>
    </header>

    <!-- Error Fallback Message -->
    <div id="error-banner">경고: 시간 업데이트 중 오류 발생</div>

    <!-- Main Clock Section -->
    <main>
        <div id="clock-card" class="clock-card">
            <!-- Main HH:MM:SS -->
            <span id="time-main" class="time-main num-font color-red">00:00:00</span>
            <!-- Millisecond .d (1/10s) -->
            <span class="time-sub">
                <span id="time-dot" class="time-dot num-font color-red">.</span>
                <span id="time-ms" class="time-ms num-font color-red">0</span>
            </span>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer>
        <div class="toolbar">
            <!-- Color Toggle -->
            <button id="btn-color" class="btn">
                <span>🎨 <span id="txt-color">RED 모드</span></span>
            </button>

            <!-- Font Sizes -->
            <button id="btn-down" class="btn">글자 작게 (-)</button>
            <button id="btn-up" class="btn">글자 크게 (+)</button>

            <!-- Wake Lock -->
            <button id="btn-wake" class="btn">
                <span>💡 화면유지: <span id="txt-wake" style="color: #ef4444;">OFF</span></span>
            </button>

            <!-- Fullscreen -->
            <button id="btn-full" class="btn">전체화면 ⤢</button>
        </div>

        <div class="status-bar">
            <span>JST Field Engine · 0.1s Precision</span>
            <span>Zero External CDN Fail-Safe</span>
        </div>
    </footer>

    <!-- Pure Fail-safe JavaScript -->
    <script>
        (function() {
            // Internal States
            let isRedMode = true;
            let currentScale = 1.0;
            let wakeLockObj = null;

            // DOM Elements
            const timeMain = document.getElementById('time-main');
            const timeDot = document.getElementById('time-dot');
            const timeMs = document.getElementById('time-ms');
            const jstDate = document.getElementById('jst-date');
            const clockCard = document.getElementById('clock-card');
            const errorBanner = document.getElementById('error-banner');

            const btnColor = document.getElementById('btn-color');
            const txtColor = document.getElementById('txt-color');
            const btnUp = document.getElementById('btn-up');
            const btnDown = document.getElementById('btn-down');
            const btnWake = document.getElementById('btn-wake');
            const txtWake = document.getElementById('txt-wake');
            const btnFull = document.getElementById('btn-full');

            // 100% Fail-Safe Clock Calculation using Pure Math
            function tick() {
                try {
                    const now = new Date();
                    
                    // Convert local time to UTC in ms, then add 9 hours (+9 * 3600000 ms)
                    const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
                    const jstMs = utcMs + (9 * 3600000);
                    const jst = new Date(jstMs);

                    // Extract Parts
                    const h = String(jst.getHours()).padStart(2, '0');
                    const m = String(jst.getMinutes()).padStart(2, '0');
                    const s = String(jst.getSeconds()).padStart(2, '0');
                    const ms1 = Math.floor(now.getMilliseconds() / 100);

                    // Update Clock Text
                    timeMain.textContent = h + ':' + m + ':' + s;
                    timeMs.textContent = ms1;

                    // Date String
                    const year = jst.getFullYear();
                    const month = String(jst.getMonth() + 1).padStart(2, '0');
                    const date = String(jst.getDate()).padStart(2, '0');
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const day = days[jst.getDay()];

                    jstDate.textContent = year + '.' + month + '.' + date + ' (' + day + ')';
                } catch (err) {
                    if (errorBanner) errorBanner.style.display = 'block';
                }
            }

            // High Contrast Color Switcher
            function toggleColor() {
                isRedMode = !isRedMode;
                const elements = [timeMain, timeDot, timeMs];

                elements.forEach(el => {
                    if (isRedMode) {
                        el.classList.remove('color-white');
                        el.classList.add('color-red');
                    } else {
                        el.classList.remove('color-red');
                        el.classList.add('color-white');
                    }
                });

                txtColor.textContent = isRedMode ? 'RED 모드' : 'WHITE 모드';
            }

            // Font Resizing (+ / -)
            function resizeFont(delta) {
                currentScale += delta;
                if (currentScale < 0.6) currentScale = 0.6;
                if (currentScale > 1.8) currentScale = 1.8;
                clockCard.style.transform = 'scale(' + currentScale + ')';
            }

            // Screen Wake Lock API for iPad / iPhone
            async function toggleWakeLock() {
                if ('wakeLock' in navigator) {
                    try {
                        if (!wakeLockObj) {
                            wakeLockObj = await navigator.wakeLock.request('screen');
                            txtWake.textContent = 'ON';
                            txtWake.style.color = '#22c55e';
                            btnWake.classList.add('btn-active');

                            wakeLockObj.addEventListener('release', () => {
                                wakeLockObj = null;
                                txtWake.textContent = 'OFF';
                                txtWake.style.color = '#ef4444';
                                btnWake.classList.remove('btn-active');
                            });
                        } else {
                            await wakeLockObj.release();
                            wakeLockObj = null;
                        }
                    } catch (e) {
                        alert('화면 유지를 켤 수 없습니다.');
                    }
                } else {
                    alert('브라우저 설정에서 자동 잠금을 꺼주세요.');
                }
            }

            // Fullscreen
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            }

            // Event Listeners
            btnColor.addEventListener('click', toggleColor);
            btnUp.addEventListener('click', () => resizeFont(0.1));
            btnDown.addEventListener('click', () => resizeFont(-0.1));
            btnWake.addEventListener('click', toggleWakeLock);
            btnFull.addEventListener('click', toggleFullscreen);

            // Re-apply wake lock on tab switch
            document.addEventListener('visibilitychange', async () => {
                if (wakeLockObj !== null && document.visibilityState === 'visible') {
                    try {
                        wakeLockObj = await navigator.wakeLock.request('screen');
                    } catch (e) {}
                }
            });

            // Start High-speed 50ms Render Loop
            tick();
            setInterval(tick, 50);
        })();
    </script>
</body>
</html>
