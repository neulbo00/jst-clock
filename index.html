<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Minimal Japan Standard Time display">
  <title>JST CLOCK</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="clock-shell">
    <header class="topline">
      <div class="brand">neulbo <span>CLOCK</span></div>
      <div class="timezone">JAPAN STANDARD TIME <span>UTC+09:00</span></div>
    </header>
    <section class="clock" aria-label="Current Japan time">
      <div class="time-row">
        <span id="hours">--</span><i>:</i><span id="minutes">--</span><i>:</i><span id="seconds">--</span><span class="milliseconds" id="milliseconds">.</span>
      </div>
    </section>
    <section class="date-row">
      <div id="date">----</div>
      <div id="weekday">---</div>
    </section>
    <footer class="status-area">
      <div class="status-line">
        <span class="status-dot" id="status-dot"></span>
        <span id="sync-status">DEVICE CLOCK · NOT NICT-SYNCED</span>
      </div>
      <div class="status-note" id="status-note">
        This first build displays the device clock. NICT NTP synchronization is not yet connected.
      </div>
      <div class="footer-links">
        <a href="https://www.nict.go.jp/JST/JST5.html" target="_blank" rel="noopener">NICT JST CLOCK ↗</a>
        <button id="fullscreen" type="button">FULL SCREEN</button>
      </div>
    </footer>
  </main>
  <script src="./js/clock.js"></script>
</body>
</html>
