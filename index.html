<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JST Field Clock</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #000000;
            color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
        .text-red-glow {
            color: #ff1a1a !important;
            text-shadow: 0 0 16px rgba(255, 0, 0, 0.4);
        }
        .text-white-glow {
            color: #ffffff !important;
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 bg-black">

    <!-- Header / JST Date & Weather -->
    <header class="w-full max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center bg-slate-900/90 border border-slate-800 rounded-xl px-5 py-3 gap-2">
        <div class="flex items-center gap-3">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
            <span class="text-xs sm:text-sm font-semibold tracking-wider text-slate-400">JAPAN STANDARD TIME (UTC+9)</span>
        </div>
        <div class="flex items-center gap-3">
            <div id="jst-date" class="mono-font text-sm sm:text-base font-bold text-slate-200">2026.00.00 (...)</div>
            <div id="tokyo-weather" class="mono-font text-xs sm:text-sm text-slate-300 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
                도쿄 날씨 로딩중...
            </div>
        </div>
    </header>

    <!-- Main Clock Section -->
    <main class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center my-auto py-8">
        <div class="text-center w-full">
            <div class="inline-flex items-baseline justify-center px-4 py-8 bg-slate-950 border border-slate-800/80 rounded-2xl shadow-2xl w-full">
                <span id="clock-hours" class="mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow">00</span>
                <span class="mono-font font-bold text-6xl sm:text-8xl mx-1 sm:mx-2 text-slate-600 animate-pulse">:</span>
                <span id="clock-minutes" class="mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow">00</span>
                <span class="mono-font font-bold text-6xl sm:text-8xl mx-1 sm:mx-2 text-slate-600 animate-pulse">:</span>
                <span id="clock-seconds" class="mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow">00</span>
                <span class="mono-font font-bold text-6xl sm:text-8xl mx-1 sm:mx-2 text-slate-600">.</span>
                <span id="clock-millis" class="mono-font font-bold text-4xl sm:text-6xl text-slate-400 w-12 sm:w-20 text-left">0</span>
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-4xl mx-auto flex flex-col gap-3">
        <div class="grid grid-cols-2 sm:flex sm:flex-wrap justify-center gap-2">
            <!-- Color Mode Toggle -->
            <button onclick="toggleColorMode()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-2">
                <span id="color-indicator" class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                <span id="color-text">레드 모드</span>
            </button>

            <!-- Font Size - -->
            <button onclick="adjustFontSize(-0.1)" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 transition">
                글자 작게 (-)
            </button>

            <!-- Font Size + -->
            <button onclick="adjustFontSize(0.1)" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 transition">
                글자 크게 (+)
            </button>

            <!-- Wake Lock -->
            <button onclick="toggleWakeLock()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 transition">
                💡 화면유지: <span id="wakelock-status" class="text-red-400 font-bold">OFF</span>
            </button>

            <!-- Fullscreen -->
            <button onclick="toggleFullScreen()" class="col-span-2 sm:col-span-1 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 transition">
                전체 화면 ⤢
            </button>
        </div>

        <div class="flex justify-between items-center text-xs text-slate-500 px-2">
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> JST Field Engine v2.0</span>
            <a href="https://www.nict.go.jp/JST/JST5.html" target="_blank" rel="noopener" class="underline hover:text-slate-400">NICT JST ↗</a>
        </div>
    </footer>

    <script>
        var isRedMode = true;
        var currentScale = 1.0;
        var wakeLock = null;

        function toggleColorMode() {
            isRedMode = !isRedMode;
            var h = document.getElementById('clock-hours');
            var m = document.getElementById('clock-minutes');
            var s = document.getElementById('clock-seconds');
            var ind = document.getElementById('color-indicator');
            var txt = document.getElementById('color-text');

            if (isRedMode) {
                h.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow";
                m.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow";
                s.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow";
                ind.className = "w-3 h-3 rounded-full bg-red-500 inline-block";
                txt.textContent = "레드 모드";
            } else {
                h.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-white-glow";
                m.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-white-glow";
                s.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-white-glow";
                ind.className = "w-3 h-3 rounded-full bg-white inline-block";
                txt.textContent = "화이트 모드";
            }
        }

        function adjustFontSize(delta) {
            currentScale += delta;
            if (currentScale < 0.6) currentScale = 0.6;
            if (currentScale > 1.6) currentScale = 1.6;

            var els = [document.getElementById('clock-hours'), document.getElementById('clock-minutes'), document.getElementById('clock-seconds')];
            for (var i = 0; i < els.length; i++) {
                els[i].style.transform = 'scale(' + currentScale + ')';
                els[i].style.display = 'inline-block';
            }
        }

        function toggleWakeLock() {
            if ('wakeLock' in navigator) {
                if (wakeLock === null) {
                    navigator.wakeLock.request('screen').then(function(lock) {
                        wakeLock = lock;
                        document.getElementById('wakelock-status').textContent = 'ON';
                        document.getElementById('wakelock-status').className = 'text-emerald-400 font-bold';
                        wakeLock.addEventListener('release', function() {
                            wakeLock = null;
                            document.getElementById('wakelock-status').textContent = 'OFF';
                            document.getElementById('wakelock-status').className = 'text-red-400 font-bold';
                        });
                    }).catch(function(err) {
                        alert('화면 유지 실패');
                    });
                } else {
                    wakeLock.release();
                    wakeLock = null;
                }
            } else {
                alert('이 브라우저는 화면 유지를 지원하지 않습니다.');
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(function(e){});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=35.6762&longitude=139.6503&current=temperature_2m,weather_code', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data && data.current) {
                            var temp = Math.round(data.current.temperature_2m);
                            var code = data.current.weather_code;
                            var desc = "맑음";
                            if (code >= 1 && code <= 3) desc = "구름";
                            else if (code >= 51 && code <= 67) desc = "비";
                            else if (code >= 71 && code <= 77) desc = "눈";
                            else if (code >= 95) desc = "뇌우";
                            document.getElementById('tokyo-weather').textContent = "도쿄 " + temp + "°C (" + desc + ")";
                        }
                    } catch(e) {}
                }
            };
            xhr.send();
        }

        function runClock() {
            var now = new Date();
            // JST Calc (UTC + 9 Hours)
            var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            var jst = new Date(utc + (3600000 * 9));

            var hh = jst.getHours();
            var mm = jst.getMinutes();
            var ss = jst.getSeconds();
            var ms = Math.floor(now.getMilliseconds() / 100);

            document.getElementById('clock-hours').textContent = (hh < 10 ? '0' : '') + hh;
            document.getElementById('clock-minutes').textContent = (mm < 10 ? '0' : '') + mm;
            document.getElementById('clock-seconds').textContent = (ss < 10 ? '0' : '') + ss;
            document.getElementById('clock-millis').textContent = ms;

            var y = jst.getFullYear();
            var m = jst.getMonth() + 1;
            var d = jst.getDate();
            var dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            var day = dayNames[jst.getDay()];

            document.getElementById('jst-date').textContent = y + '.' + (m < 10 ? '0' : '') + m + '.' + (d < 10 ? '0' : '') + d + ' (' + day + ')';
        }

        // Run Engine
        setInterval(runClock, 50);
        runClock();
        fetchWeather();
        setInterval(fetchWeather, 900000);
    </script>
</body>
</html>
