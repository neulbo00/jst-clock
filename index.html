<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>neulbo CLOCK | JST Field Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #0b0b0b;
      --line: #242424;
      --muted: #777;
      --digits: #ff3030;
      --scale: 1;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      padding: clamp(16px, 3vw, 36px);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: #eee;
      font-family: "Noto Sans KR", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .topbar, .bottombar {
      width: min(100%, 1500px);
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font: 700 14px/1 "JetBrains Mono", monospace;
      letter-spacing: .16em;
      color: #eee;
      white-space: nowrap;
    }
    .zone {
      margin-top: 8px;
      color: #888;
      font: 500 11px/1.4 "JetBrains Mono", monospace;
      letter-spacing: .12em;
    }
    .date {
      color: #bdbdbd;
      font: 600 clamp(12px, 1.5vw, 16px)/1.4 "JetBrains Mono", monospace;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    main {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: 5vh;
    }
    .clock-panel {
      width: min(100%, 1500px);
      padding: clamp(24px, 5vw, 72px) clamp(12px, 3vw, 44px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      text-align: center;
    }
    .clock-label {
      margin-bottom: clamp(20px, 4vw, 48px);
      color: #666;
      font: 600 11px/1 "JetBrains Mono", monospace;
      letter-spacing: .22em;
    }
    .clock {
      display: flex;
      align-items: baseline;
      justify-content: center;
      white-space: nowrap;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(42px, 13.2vw, 190px);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: -.075em;
      transform: scale(var(--scale));
      transform-origin: center;
    }
    .digit {
      display: inline-block;
      width: 1.20ch;
      color: var(--digits);
      text-shadow: 0 0 18px color-mix(in srgb, var(--digits) 22%, transparent);
      text-align: center;
    }
    .separator {
      display: inline-block;
      width: .58ch;
      color: #555;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0;
    }
    .tenths {
      display: inline-block;
      width: .72ch;
      margin-left: .04ch;
      color: var(--digits);
      font-size: .55em;
      font-weight: 600;
      text-align: left;
      letter-spacing: 0;
    }
    .subline {
      margin-top: clamp(24px, 4vw, 46px);
      color: #666;
      font: 500 11px/1.5 "JetBrains Mono", monospace;
      letter-spacing: .12em;
    }
    .controls {
      width: min(100%, 900px);
      margin: 0 auto 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    button {
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid #303030;
      border-radius: 6px;
      background: #111;
      color: #ddd;
      font: 600 12px "Noto Sans KR", sans-serif;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button:hover { background: #1b1b1b; border-color: #555; }
    button:focus-visible { outline: 2px solid #aaa; outline-offset: 3px; }
    button[aria-pressed="true"] { border-color: #777; background: #202020; }
    .bottombar {
      color: #555;
      font: 500 10px/1.5 "JetBrains Mono", monospace;
      letter-spacing: .06em;
    }
    .bottombar a { color: #777; text-decoration: none; }
    .bottombar a:hover { color: #ddd; }
    @media (max-width: 560px) {
      body { padding: 16px 12px; }
      .topbar { align-items: flex-start; }
      .clock-panel { border-radius: 8px; padding-inline: 4px; }
      .clock { font-size: clamp(36px, 12.8vw, 72px); letter-spacing: -.09em; }
      .digit { flex-basis: 2ch; width: 2ch; }
      .separator { width: .48ch; }
      .controls { gap: 8px; }
      button { flex: 1 1 calc(50% - 8px); padding-inline: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">neulbo CLOCK</div>
      <div class="zone">JAPAN STANDARD TIME · UTC+9</div>
    </div>
    <div id="jst-date" class="date" aria-label="Japan Standard Time date">----</div>
  </header>

  <main>
    <section class="clock-panel" aria-label="Japan Standard Time clock">
      <div class="clock-label">JST / 24-HOUR CLOCK</div>
      <div class="clock" role="timer" aria-live="off" aria-label="Japan Standard Time">
        <span id="hh" class="digit">00</span><span class="separator">:</span><span id="mm" class="digit">00</span><span class="separator">:</span><span id="ss" class="digit">00</span><span class="separator">.</span><span id="tenth" class="tenths">0</span>
      </div>
      <div class="subline">SYSTEM CLOCK · 0.1 SECOND DISPLAY</div>
    </section>
  </main>

  <nav class="controls" aria-label="Clock controls">
    <button id="colorBtn" type="button" aria-pressed="true">RED / WHITE</button>
    <button id="smallerBtn" type="button" aria-label="Decrease clock size">글자 작게 −</button>
    <button id="largerBtn" type="button" aria-label="Increase clock size">글자 크게 +</button>
    <button id="wakeBtn" type="button" aria-pressed="false">화면 유지 OFF</button>
    <button id="fullBtn" type="button">전체 화면</button>
  </nav>

  <footer class="bottombar">
    <span id="clock-status">LOCAL DEVICE TIME · JST</span>
    <a href="https://www.nict.go.jp/JST/JST5.html" target="_blank" rel="noopener noreferrer">NICT 時刻情報 ↗</a>
  </footer>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit",
        day: "2-digit", weekday: "short"
      });
      const timeFormatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit",
        second: "2-digit", hourCycle: "h23"
      });

      let scale = 1;
      let redMode = true;
      let wakeLock = null;
      let wakeRequested = false;

      function renderClock() {
        const now = new Date();
        const parts = Object.fromEntries(
          timeFormatter.formatToParts(now).map(part => [part.type, part.value])
        );
        $("hh").textContent = parts.hour;
        $("mm").textContent = parts.minute;
        $("ss").textContent = parts.second;
        $("tenth").textContent = Math.floor(now.getMilliseconds() / 100);
        $("jst-date").textContent = dateFormatter.format(now).replaceAll("/", ".").replace(",", "");
        const delay = 100 - (Date.now() % 100);
        window.setTimeout(renderClock, delay);
      }

      function setWakeStatus(enabled) {
        $("wakeBtn").textContent = enabled ? "화면 유지 ON" : "화면 유지 OFF";
        $("wakeBtn").setAttribute("aria-pressed", String(enabled));
      }

      async function acquireWakeLock() {
        if (!wakeRequested || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
        try {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
            if (!wakeRequested) setWakeStatus(false);
          }, { once: true });
        } catch {
          wakeRequested = false;
          setWakeStatus(false);
          $("clock-status").textContent = "SCREEN WAKE LOCK UNAVAILABLE";
        }
      }

      $("colorBtn").addEventListener("click", () => {
        redMode = !redMode;
        document.documentElement.style.setProperty("--digits", redMode ? "#ff3030" : "#f2f2f2");
        $("colorBtn").setAttribute("aria-pressed", String(redMode));
      });
      $("smallerBtn").addEventListener("click", () => {
        scale = Math.max(.65, +(scale - .05).toFixed(2));
        document.documentElement.style.setProperty("--scale", scale);
      });
      $("largerBtn").addEventListener("click", () => {
        scale = Math.min(1.35, +(scale + .05).toFixed(2));
        document.documentElement.style.setProperty("--scale", scale);
      });
      $("wakeBtn").addEventListener("click", async () => {
        if (wakeRequested) {
          wakeRequested = false;
          if (wakeLock) await wakeLock.release();
          wakeLock = null;
          setWakeStatus(false);
        } else if ("wakeLock" in navigator) {
          wakeRequested = true;
          await acquireWakeLock();
          setWakeStatus(wakeRequested);
        } else {
          $("clock-status").textContent = "SCREEN WAKE LOCK NOT SUPPORTED";
        }
      });
      $("fullBtn").addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch { /* Fullscreen may be blocked by the browser. */ }
      });
      document.addEventListener("fullscreenchange", () => {
        $("fullBtn").textContent = document.fullscreenElement ? "전체 화면 종료" : "전체 화면";
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && wakeRequested && !wakeLock) acquireWakeLock();
      });
      document.addEventListener("keydown", (event) => {
        if (event.target.closest("button")) return;
        if (event.key === "f" || event.key === "F") $("fullBtn").click();
        if (event.key === "+" || event.key === "=") $("largerBtn").click();
        if (event.key === "-") $("smallerBtn").click();
        if (event.key === "r" || event.key === "R") $("colorBtn").click();
        if (event.key === "w" || event.key === "W") $("wakeBtn").click();
      });

      renderClock();
    })();
  </script>
</body>
</html>
