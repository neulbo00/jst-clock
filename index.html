<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JST Field Clock</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #000000;
            color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
        .text-red-glow {
            color: #ff2a2a !important;
            text-shadow: 0 0 20px rgba(255, 30, 30, 0.45);
        }
        .text-white-glow {
            color: #ffffff !important;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.45);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 bg-black">

    <!-- Header / JST Date & Weather -->
    <header class="w-full max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center glass-card rounded-2xl px-6 py-4 shadow-xl gap-3">
        <div class="flex items-center gap-3">
            <span class="inline-block w-3 h-3 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
            <span class="text-xs sm:text-sm font-bold tracking-widest text-slate-300">JAPAN STANDARD TIME (UTC+9)</span>
        </div>
        <div class="flex items-center gap-4">
            <div id="jst-date" class="mono-font text-sm sm:text-base font-bold text-slate-100">----.--.-- (...)</div>
            <div id="tokyo-weather" class="mono-font text-xs sm:text-sm text-slate-300 bg-slate-800/90 px-3.5 py-1.5 rounded-xl border border-slate-700/80 shadow-inner flex items-center gap-1.5">
                <span>도쿄</span> <span id="weather-val" class="font-bold text-amber-400">날씨 불러오는 중...</span>
            </div>
        </div>
    </header>

    <!-- Main Clock Section -->
    <main class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center my-auto py-6">
        <div class="text-center w-full">
            <div class="inline-flex items-baseline justify-center px-4 py-10 bg-slate-950/90 border border-slate-800/90 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.9)] w-full">
                <span id="clock-hours" class="mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow transition-transform duration-100">00</span>
                <span class="mono-font font-bold text-6xl sm:text-8xl mx-1 sm:mx-2 text-slate-600 animate-pulse">:</span>
                <span id="clock-minutes" class="mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow transition-transform duration-100">00</span>
                <span class="mono-font font-bold text-6xl sm:text-8xl mx-1 sm:mx-2 text-slate-600 animate-pulse">:</span>
                <span id="clock-seconds" class="mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow transition-transform duration-100">00</span>
                <span class="mono-font font-bold text-6xl sm:text-8xl mx-1 sm:mx-2 text-slate-600">.</span>
                <span id="clock-millis" class="mono-font font-bold text-4xl sm:text-6xl text-slate-400 w-12 sm:w-20 text-left">0</span>
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-4xl mx-auto flex flex-col gap-4">
        <div class="grid grid-cols-2 sm:flex sm:flex-wrap justify-center gap-2.5">
            <!-- Color Mode Toggle -->
            <button onclick="toggleColorMode()" class="px-4 py-3 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700/80 transition active:scale-95 flex items-center justify-center gap-2 shadow-md">
                <span id="color-indicator" class="w-3 h-3 rounded-full bg-red-500 inline-block shadow-[0_0_6px_rgba(239,68,68,0.8)]"></span>
                <span id="color-text">레드 모드</span>
            </button>

            <!-- Font Size - -->
            <button onclick="adjustFontSize(-0.1)" class="px-4 py-3 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700/80 transition active:scale-95 shadow-md">
                글자 작게 (-)
            </button>

            <!-- Font Size + -->
            <button onclick="adjustFontSize(0.1)" class="px-4 py-3 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700/80 transition active:scale-95 shadow-md">
                글자 크게 (+)
            </button>

            <!-- Wake Lock -->
            <button onclick="toggleWakeLock()" class="px-4 py-3 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700/80 transition active:scale-95 shadow-md">
                💡 화면유지: <span id="wakelock-status" class="text-red-400 font-bold">OFF</span>
            </button>

            <!-- Fullscreen -->
            <button onclick="toggleFullScreen()" class="col-span-2 sm:col-span-1 px-4 py-3 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700/80 transition active:scale-95 shadow-md">
                전체 화면 ⤢
            </button>
        </div>

        <div class="flex justify-between items-center text-xs text-slate-400 px-2">
            <span class="flex items-center gap-2 font-medium"><span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.8)]"></span> JST Field Engine v2.5</span>
            <a href="https://www.nict.go.jp/JST/JST5.html" target="_blank" rel="noopener" class="underline hover:text-slate-200 font-medium transition">NICT JST ↗</a>
        </div>
    </footer>

    <script>
        var isRedMode = true;
        var currentScale = 1.0;
        var wakeLock = null;

        function toggleColorMode() {
            isRedMode = !isRedMode;
            var h = document.getElementById('clock-hours');
            var m = document.getElementById('clock-minutes');
            var s = document.getElementById('clock-seconds');
            var ind = document.getElementById('color-indicator');
            var txt = document.getElementById('color-text');

            if (isRedMode) {
                h.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow transition-transform duration-100";
                m.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow transition-transform duration-100";
                s.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-red-glow transition-transform duration-100";
                ind.className = "w-3 h-3 rounded-full bg-red-500 inline-block shadow-[0_0_6px_rgba(239,68,68,0.8)]";
                txt.textContent = "레드 모드";
            } else {
                h.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-white-glow transition-transform duration-100";
                m.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-white-glow transition-transform duration-100";
                s.className = "mono-font font-extrabold text-7xl sm:text-9xl tracking-tight text-white-glow transition-transform duration-100";
                ind.className = "w-3 h-3 rounded-full bg-white inline-block shadow-[0_0_6px_rgba(255,255,255,0.8)]";
                txt.textContent = "화이트 모드";
            }
        }

        function adjustFontSize(delta) {
            currentScale += delta;
            if (currentScale < 0.6) currentScale = 0.6;
            if (currentScale > 1.6) currentScale = 1.6;

            var els = [document.getElementById('clock-hours'), document.getElementById('clock-minutes'), document.getElementById('clock-seconds')];
            for (var i = 0; i < els.length; i++) {
                els[i].style.transform = 'scale(' + currentScale + ')';
                els[i].style.display = 'inline-block';
            }
        }

        function toggleWakeLock() {
            if ('wakeLock' in navigator) {
                if (wakeLock === null) {
                    navigator.wakeLock.request('screen').then(function(lock) {
                        wakeLock = lock;
                        document.getElementById('wakelock-status').textContent = 'ON';
                        document.getElementById('wakelock-status').className = 'text-emerald-400 font-bold';
                        wakeLock.addEventListener('release', function() {
                            wakeLock = null;
                            document.getElementById('wakelock-status').textContent = 'OFF';
                            document.getElementById('wakelock-status').className = 'text-red-400 font-bold';
                        });
                    }).catch(function(err) {
                        alert('화면 유지 설정 불가');
                    });
                } else {
                    wakeLock.release();
                    wakeLock = null;
                }
            } else {
                alert('이 브라우저는 화면 유지를 지원하지 않습니다.');
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(function(e){});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // 도쿄 날씨 불러오기 (Open-Meteo API)
        function fetchWeather() {
            var el = document.getElementById('weather-val');
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=35.6762&longitude=139.6503&current=temperature_2m,weather_code';
            
            fetch(url).then(function(res) {
                return res.json();
            }).then(function(data) {
                if (data && data.current) {
                    var temp = Math.round(data.current.temperature_2m);
                    var code = data.current.weather_code;
                    var desc = "☀️ 맑음";
                    if (code >= 1 && code <= 3) desc = "⛅ 구름";
                    else if (code >= 51 && code <= 67) desc = "🌧️ 비";
                    else if (code >= 71 && code <= 77) desc = "❄️ 눈";
                    else if (code >= 95) desc = "⚡ 뇌우";
                    
                    if (el) el.innerHTML = '<span class="text-white font-bold">' + temp + '°C</span> <span class="text-slate-300 font-normal">' + desc + '</span>';
                }
            }).catch(function(err) {
                if (el) el.textContent = '날씨 정보 없음';
            });
        }

        function runClock() {
            var now = new Date();
            var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            var jst = new Date(utc + (3600000 * 9));

            var hh = jst.getHours();
            var mm = jst.getMinutes();
            var ss = jst.getSeconds();
            var ms = Math.floor(now.getMilliseconds() / 100);

            document.getElementById('clock-hours').textContent = (hh < 10 ? '0' : '') + hh;
            document.getElementById('clock-minutes').textContent = (mm < 10 ? '0' : '') + mm;
            document.getElementById('clock-seconds').textContent = (ss < 10 ? '0' : '') + ss;
            document.getElementById('clock-millis').textContent = ms;

            var y = jst.getFullYear();
            var m = jst.getMonth() + 1;
            var d = jst.getDate();
            var dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            var day = dayNames[jst.getDay()];

            document.getElementById('jst-date').textContent = y + '.' + (m < 10 ? '0' : '') + m + '.' + (d < 10 ? '0' : '') + d + ' (' + day + ')';
        }

        // 실행
        runClock();
        setInterval(runClock, 50);
        fetchWeather();
        setInterval(fetchWeather, 900000); // 15분마다 날씨 갱신
    </script>
</body>
</html>
